<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Website Resmi DBMSDA Kota Bekasi</title>
    <meta name="description" content="Portal resmi DBMSDA Kota Bekasi yang menyediakan informasi seputar bina marga, sumber daya air, pembangunan infrastruktur, jalan, drainase, program, dan layanan masyarakat." />
    <meta name="keywords" content="DBMSDA Kota Bekasi, Dinas Bina Marga dan Sumber Daya Air, DBMSDA, Kota Bekasi, Dinas Kota Bekasi, bina marga Bekasi, sumber daya air Bekasi, jalan Kota Bekasi, drainase Bekasi, infrastruktur Kota Bekasi, pembangunan jalan Bekasi, pemeliharaan jalan Bekasi, layanan DBMSDA, program DBMSDA Bekasi, informasi DBMSDA" />

    <meta name="msvalidate.01" content="344BCC48AA82459D58355D07FC20E714" />
    <link rel="icon" type="image/png" href="/assets/favicon.png" />
    <meta property="og:locale" content="id_ID" />

    <link rel="stylesheet" href="/vendor/css/swiper.css" />
    <link rel="stylesheet" href="/vendor/css/main.css" />
    <!-- Verifikasi Google News Publisher / Subscribe with Google (SWG).
      Statis di <head> agar terbaca verifikator tanpa eksekusi JS dan ikut
      terbawa hasil prerender + 404.html fallback. -->
    <script async src="https://news.google.com/swg/js/v1/swg-basic.js"></script>
    <script>
      (self.SWG_BASIC = self.SWG_BASIC || []).push(function (basicSubscriptions) {
        basicSubscriptions.init({
          type: "NewsArticle",
          isPartOfType: ["Product"],
          isPartOfProductId: "CAowmf_HDA:openaccess",
          clientOptions: { theme: "light", lang: "id" },
        });
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
